# Robô de coleta: busca os encartes nos sites dos mercados, atualiza os dados e publica.
# Fica ATIVO quando este projeto estiver no repositório próprio (o GitHub só lê
# .github/workflows na raiz do repositório). Também dá para rodar à mão na aba "Actions".
name: Coletar encartes

on:
  schedule:
    - cron: '17 9 * * *'   # 06:17 no Rio (pega o "Boa do Dia" e ofertas do dia)
    - cron: '43 13 * * *'  # 10:43 no Rio (o Guanabara atualiza o encarte às segundas até 10h)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coletar (segue mesmo se um mercado falhar)
        id: coleta
        run: npm run coletar || echo "falhou=1" >> "$GITHUB_OUTPUT"
      - name: Importar, testar e conferir o build
        run: npm run build && npm test
      - name: Salvar dados novos
        run: |
          git config user.name "radar-robo"
          git config user.email "radar-robo@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sem novidades."; exit 0; fi
          git commit -m "Robô: encartes atualizados em $(date -u +%Y-%m-%d)"
          git push
      - name: Avisar falha de coleta
        if: steps.coleta.outputs.falhou == '1'
        run: |
          echo "::error::Algum mercado falhou na coleta. Veja o passo 'Coletar' acima (o site pode ter mudado)."
          exit 1
